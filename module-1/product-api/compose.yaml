# PostgreSQL for the dev profile. Local use only: the password is not a secret.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: module1_dev
      POSTGRES_USER: module1
      POSTGRES_PASSWORD: module1
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U module1 -d module1_dev"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
