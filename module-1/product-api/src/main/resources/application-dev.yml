# The defaults match the PostgreSQL container in compose.yaml.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:module1_dev}
    username: ${DB_USERNAME:module1}
    password: ${DB_PASSWORD:module1}
    hikari:
      maximum-pool-size: 5

logging:
  level:
    com.epam.module1.productapi: DEBUG
